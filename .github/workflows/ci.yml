# Checks for pull requests and main. GitHub-hosted runners only, actions pinned to commit
# SHAs, and no permission beyond reading the repository.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # fmt, clippy with warnings as errors, cargo-deny's bans, licences and sources, and
  # actionlint on these workflows. Advisories run in advisories.yml and never block a
  # pull request.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      ACTIONLINT_VERSION: 1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      # Tools pinned by artifact URL and SHA-256; `cargo xtask fetch` verifies the download
      # before it unpacks or writes anything.
      - name: Fetch cargo-deny
        run: >-
          cargo xtask fetch
          --url "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          --sha256 "$CARGO_DENY_SHA256"
          --member "cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny"
          --out "$HOME/.cargo/bin/cargo-deny"
      - name: Fetch actionlint
        run: >-
          cargo xtask fetch
          --url "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          --sha256 "$ACTIONLINT_SHA256"
          --member actionlint
          --out "$HOME/.cargo/bin/actionlint"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo deny --locked check bans licenses sources
      - run: actionlint

  # The tests under nextest with line and branch coverage, then every crate held to the
  # floors in its own Cargo.toml (at least 99% of lines and of branches). Branch coverage
  # is unstable, so this job builds with a pinned nightly.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      COVERAGE_TOOLCHAIN: nightly-2026-10-01
      CARGO_LLVM_COV_VERSION: 0.9.1
      CARGO_LLVM_COV_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
      CARGO_NEXTEST_VERSION: 0.9.146
      CARGO_NEXTEST_SHA256: 682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      # Pinned by artifact URL and SHA-256; xtask builds with the coverage nightly, the
      # only toolchain installed in this job.
      - name: Fetch cargo-llvm-cov
        run: >-
          cargo "+$COVERAGE_TOOLCHAIN" xtask fetch
          --url "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v$CARGO_LLVM_COV_VERSION/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          --sha256 "$CARGO_LLVM_COV_SHA256"
          --member cargo-llvm-cov
          --out "$HOME/.cargo/bin/cargo-llvm-cov"
      - name: Fetch cargo-nextest
        run: >-
          cargo "+$COVERAGE_TOOLCHAIN" xtask fetch
          --url "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$CARGO_NEXTEST_VERSION/cargo-nextest-$CARGO_NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          --sha256 "$CARGO_NEXTEST_SHA256"
          --member cargo-nextest
          --out "$HOME/.cargo/bin/cargo-nextest"
      - run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov nextest --workspace --locked --profile coverage --branch --lcov --output-path lcov.info
      - run: cargo "+$COVERAGE_TOOLCHAIN" xtask coverage --lcov lcov.info --root "$GITHUB_WORKSPACE" --summary "$GITHUB_STEP_SUMMARY"
