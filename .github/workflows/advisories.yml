# RustSec advisories for the locked dependencies. A separate workflow, so an advisory never
# blocks a pull request; it runs daily and on main.
name: advisories

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned by version; cargo checks the crate against the crates.io index's checksum.
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny --locked check advisories
