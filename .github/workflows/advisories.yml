# RustSec advisories for the locked dependencies. A separate workflow, so an advisory never
# blocks a pull request; it runs daily and on main.
name: advisories

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned by artifact URL and SHA-256; `cargo xtask fetch` verifies the download before
      # it unpacks or writes anything.
      - name: Fetch cargo-deny
        run: >-
          cargo xtask fetch
          --url "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          --sha256 "$CARGO_DENY_SHA256"
          --member "cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny"
          --out "$HOME/.cargo/bin/cargo-deny"
      - run: cargo deny --locked check advisories
