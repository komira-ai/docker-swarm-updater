# cargo-deny configuration. The lint check runs `cargo deny check bans licenses sources`;
# advisories run in their own workflow (advisories.yml) and never block a pull request.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only. Anything not listed, including every copyleft licence, is refused.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are not published; their licence is the workspace's Apache-2.0.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
