[package]
name = "xtask"
description = "Repository checks and CI helpers: coverage floors, layers, pinned downloads, release steps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Coverage floors of this crate, read by `cargo xtask coverage` (never below 99).
[package.metadata.coverage]
lines = 99.0
branches = 99.0

[dependencies]
serde.workspace = true
toml.workspace = true
ureq.workspace = true
flate2.workspace = true
tar.workspace = true
sha2.workspace = true
hex.workspace = true
url.workspace = true
rustls.workspace = true
jiff.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_yaml_ng.workspace = true
tempfile.workspace = true
rcgen.workspace = true
rustls-pki-types.workspace = true
# The release image is checked with the updater's own verifier and a test Sigstore instance.
dsu-core.workspace = true
dsu-server.workspace = true
dsu-testkit.workspace = true
dsu-verify.workspace = true
