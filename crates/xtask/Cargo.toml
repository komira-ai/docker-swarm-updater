[package]
name = "xtask"
description = "Repository checks and CI tool fetching: coverage floors, layers, pinned downloads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Coverage floors of this crate, read by `cargo xtask coverage` (never below 99).
[package.metadata.coverage]
lines = 99.0
branches = 99.0

[dependencies]
serde.workspace = true
toml.workspace = true
ureq.workspace = true
flate2.workspace = true
tar.workspace = true
sha2.workspace = true
hex.workspace = true
url.workspace = true
rustls.workspace = true

[dev-dependencies]
tempfile.workspace = true
rcgen.workspace = true
rustls-pki-types.workspace = true
